aid: janio
name: Janio
description: 'Janio is a Singapore-headquartered fourth-party logistics (4PL) provider
  serving Southeast Asia and Greater China. Rather than owning trucks or warehouses,
  Janio orchestrates a network of 500+ vetted carriers and 3PLs on a customer''s behalf
  under one contract, one invoice and one SLA, across land, air and ocean freight plus
  warehousing. Its platform covers multi-carrier allocation, logistics-as-a-service,
  strategic procurement, a supply-chain control tower and automated freight invoice
  audit. Janio publishes a production REST API at api.janio.asia for order creation,
  tracking, rating, label generation, inventory sync and webhook events, together with
  pre-built Shopify, WooCommerce and Magento connectors — but the API reference itself
  is released only on request through the sales contact form, so no machine-readable
  contract is publicly available.'
