webhooks:
  advertised: true
  documented: false
  events_claimed:
  - shipment status
  - delivery updates
  - exception alerts
  source: https://www.janio.asia/integrations
  note: 'Webhooks are advertised in prose on the Integrations page but no event
    catalog, payload schema, signing scheme, retry policy or endpoint-registration
    procedure is published. No Webhooks or AsyncAPI pointer is emitted, because an
    advertised capability with no published event surface is a claim, not a
    contract. If Janio publishes the event list, this becomes an asyncapi/ artifact.'
sandbox:
  advertised: true
  documented: false
  source: https://www.janio.asia/integrations
  note: '"Sandbox testing environment" is listed as an integration benefit, but no
    sandbox host, test credential, test tracking number, magic identifier or fixture
    is published. No Sandbox pointer is emitted for the same reason as webhooks.'
reversibility:
  grade: undocumented
  applicable: true
  rationale: >-
    The API has a real write surface — Janio's own Integrations page states the API
    can "Create, update, and track orders programmatically", generate shipping
    labels, customs documents and commercial invoices, and synchronise inventory —
    so reversibility is applicable, not `na`. But Janio publishes no reversal
    operation and no reversal window anywhere a reader can reach: no cancel-order
    call, no void-label call, no return/RTO initiation, no stated cut-off such as
    "cancel before pickup" or "void a label within N hours". The FAQ, pricing and
    integrations pages are silent on cancellation entirely. An agent acting through
    this API cannot learn, before it acts, whether an order it creates or a label it
    generates can be taken back. NOTHING is asserted here about what the API
    actually supports internally — only about what a consumer can find out in
    advance, which is nothing.
  write_surfaces:
  - surface: Order creation
    reversal_operation: null
    reversal_window: null
    docs: null
    evidence: 'https://www.janio.asia/integrations describes create/update/track and
      batch order processing; no cancellation is mentioned. Live route
      https://api.janio.asia/api/order/order/create/ returns 403 anonymously.'
  - surface: Label / customs document generation
    reversal_operation: null
    reversal_window: null
    docs: null
    evidence: 'https://www.janio.asia/integrations lists label, customs document and
      commercial invoice generation; no void or cancel path is published.'
  - surface: Inventory synchronisation
    reversal_operation: null
    reversal_window: null
    docs: null
    evidence: 'Described as keeping levels synchronised across warehouses and sales
      channels; no rollback or restore semantics published.'
dry_run_mode:
  supported: unknown
  documented: false
  note: 'The Rate & Quote capability is a read-only price/transit estimate and is the
    closest thing to a rehearsal of a shipment, but Janio does not present it as a
    dry run of order creation and publishes no dry-run flag.'
