generated: '2026-08-23'
method: probed
source: 'Anonymous HTTPS probes of https://api.janio.asia (2026-08-23) plus
  https://www.janio.asia/integrations'
docs: https://www.janio.asia/integrations
note: >-
  Janio publishes no API reference, so almost every cross-cutting convention below
  is UNDOCUMENTED rather than absent — the difference matters. What could be
  established was established by probing the live production host anonymously: the
  API is real, it answers under /api/order/, and it is a Django REST Framework
  application. Everything marked `documented: false` is a gap in what Janio
  publishes, not a claim that the behaviour does not exist. Nothing here is
  inferred from a spec, because there is no spec.
surface:
  base_url: https://api.janio.asia
  style: REST/JSON
  framework_fingerprint: Django REST Framework
  evidence:
  - url: https://api.janio.asia/api/order/orders/
    status: 403
    body: '{"detail":"Permission denied."}'
  - url: https://api.janio.asia/api/order/order/create/
    status: 403
    body: '{"detail":"Permission denied."}'
  - url: https://api.janio.asia/api/v1/
    status: 404
    body: '<h1>Not Found</h1>'
  documented_capabilities:
  - Order management (create, update, track; batch processing for high volume)
  - Webhooks and events (shipment status, delivery updates, exception alerts)
  - Rate & quote (real-time shipping rates and transit times per carrier/route)
  - Tracking (unified across carriers, "standardized status codes and timestamps")
  - Inventory sync (across warehouses and sales channels)
  - Label generation (shipping labels, customs documents, commercial invoices)
  capabilities_source: https://www.janio.asia/integrations
auth:
  style: credential-required
  documented: false
  scheme: unknown
  evidence: 'Anonymous requests are rejected with HTTP 403 and the DRF
    {"detail":"Permission denied."} envelope rather than 401 with a
    WWW-Authenticate challenge, so the credential type cannot be read off the wire.
    No OAuth metadata is served (/.well-known/oauth-authorization-server 404s) and
    no auth page is published. Third-party carrier-integration vendors describe
    Janio as API-key based, but that is their statement, not Janio''s, and is not
    recorded here as fact.'
error_envelope:
  format: application/json
  shape: '{"detail": "<message>"}'
  rfc9457: false
  documented: false
  observed_status_codes:
  - 403
  - 404
  note: 'The 403 envelope was observed directly. Non-auth error shapes could not be
    observed because every path requires credentials before it reaches application
    logic. Unmatched paths return an HTML "Not Found" body rather than JSON, so the
    error format is not uniform across the host.'
idempotency:
  supported: unknown
  documented: false
  header: null
  note: 'No idempotency key, retry-safety or replay-protection guidance is published,
    and the write surface (order create, batch order upload) is exactly where it
    would matter. No Idempotency pointer is emitted in apis.yml — emitting one would
    assert a guarantee Janio does not make.'
pagination:
  style: unknown
  documented: false
  note: 'Django REST Framework list endpoints commonly paginate, and
    /api/order/orders/ is a list route, but the anonymous 403 prevents observing
    any envelope, and no docs state the scheme. Not asserted.'
versioning:
