domain_standards:
  assessed: true
  result: none-found
  note: >-
    Janio's market — cross-border 4PL, customs and multi-carrier freight — has
    several real interchange standards a contract could declare: GS1 EPCIS for
    event visibility, UN/EDIFACT IFTMIN/IFTSTA and ANSI X12 204/214 for transport
    instruction and status, ISO 6346 container identification, IATA ONE Record for
    air cargo, and DCSA for ocean. None is declared anywhere Janio publishes, and
    with no machine-readable contract there is no spec location to point evidence
    at. Reward-only dimension: recorded as absent, not as a failure. Janio's public
    surface describes a proprietary REST/webhook interface plus platform-specific
    connectors (Shopify, WooCommerce, Magento) rather than a standards-based
    interchange, and unified tracking is described as "standardized status codes"
    of Janio's own definition.
