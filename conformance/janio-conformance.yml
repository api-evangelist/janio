note: >-
  Janio makes its compliance claims in prose only — in its own llms.txt and on the
  privacy page — and does not publish a trust center, an audit report, a
  certification number or a machine-readable contract. Two of the four claims are
  explicitly stated as IN PROGRESS by Janio itself ("compliant with the controls,
  independent certification audits in progress"), and this file records that
  distinction rather than flattening it into "certified". Cross-cutting API
  standards could not be assessed at all: no OpenAPI, AsyncAPI, GraphQL SDL or
  WSDL is published, and anonymous calls to the live API are rejected before any
  response body or header can be observed.
